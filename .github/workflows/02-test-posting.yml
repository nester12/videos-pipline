name: 2 - Test Posting (reviewed video only)
on:
  workflow_dispatch:
    inputs:
      action:
        description: Check does not post; draft holds for review; queue schedules a real post
        type: choice
        options: [check, draft, queue]
        default: check
      channel_id:
        description: Required for draft/queue
        type: string
      video_url:
        description: Reviewed public direct MP4 URL, required for draft/queue
        type: string
permissions:
  contents: read
jobs:
  buffer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client (no video generation needed)
        run: python -m pip install --disable-pip-version-check requests numpy cloudinary
      - name: Check channel or explicitly create draft/queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MODE: ${{ inputs.action }}
          CHANNEL: ${{ inputs.channel_id }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          if [ "$MODE" = check ]; then
            python -m motivation test-posting --mode check
          else
            if [ -z "$CHANNEL" ] || [ -z "$VIDEO_URL" ]; then
              echo 'Both Buffer channel and reviewed video URL are required'; exit 1
            fi
            python -m motivation test-posting --mode "$MODE" --channel-id "$CHANNEL" --video-url "$VIDEO_URL"
          fi
