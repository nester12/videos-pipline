name: 0 - CHECK SYSTEM (Pipeline Tests and Connections)
on:
  push:
    branches: [main]
    paths: ['motivation/**','tests/**','requirements.txt','.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests and media tools (no TTS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests numpy cloudinary
      - name: Read-only connected service health (no posting)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m motivation doctor --live

  real-human-speech-preview:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[SMOKE-ARCHIVE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight audio and video requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --no-cache-dir --disable-pip-version-check -r requirements.txt
          df -h .
      - name: Create actual MP4 using publicly licensed real human speech (no posting)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m motivation test-video --source archive --query "motivational speech" --output output/ci-archive-preview
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/ci-archive-preview/final.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-real-voice-preview
          path: |
            output/ci-archive-preview/final.mp4
            output/ci-archive-preview/result.json
            output/ci-archive-preview/captions.srt
          retention-days: 2
          if-no-files-found: warn
