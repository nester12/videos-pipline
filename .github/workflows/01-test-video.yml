name: 1 - CREATE SAMPLE VIDEO (Real Human Voice)
run-name: 'Sample video #${{ github.run_number }} — ${{ inputs.source }}'
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Select style: cinematic B-roll vs SAME real speaker visible on camera"
        type: choice
        options:
          - "Cinematic montage (licensed speech audio)"
          - "Actual speaker on camera (my licensed video)"
        default: "Cinematic montage (licensed speech audio)"
      topic:
        description: "Montage mode: search for licensed real speech (audiobooks rejected)"
        type: string
        default: motivational speech
      speaker_video_url:
        description: 'SPEAKER VIDEO ONLY: direct MP4 link from Cloudinary, Wikimedia, or Archive'
        type: string
      rights_confirmed:
        description: 'SPEAKER VIDEO ONLY: I own or have permission to reuse BOTH audio and video'
        type: boolean
        default: false
      clean_confirmed:
        description: 'I listened: the recording has NO music behind the speech'
        type: boolean
        default: false
      separate_music:
        description: 'EXPERIMENTAL/slow: try CPU-only separation; default keeps original audio'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check selected speech source and permission before installing tools
        env:
          CHOICE: ${{ inputs.source }}
          VIDEO_URL: ${{ inputs.speaker_video_url }}
          RIGHTS: ${{ inputs.rights_confirmed }}
        run: |
          if [ "$CHOICE" = "Cinematic montage (licensed speech audio)" ]; then
            echo "SPEECH_MODE=archive" >> "$GITHUB_ENV"
            echo "::notice::Montage uses separate dramatic B-roll; it does not show the person who recorded the speech."
            if [ -n "$VIDEO_URL" ]; then echo "::notice::Speaker URL ignored in automatic search mode."; fi
          elif [ "$CHOICE" = "Actual speaker on camera (my licensed video)" ]; then
            echo "SPEECH_MODE=clip" >> "$GITHUB_ENV"
            if [ -z "$VIDEO_URL" ]; then
              echo "::error::Speaker-video mode requires a public direct MP4 URL in speaker_video_url."
              exit 1
            fi
            if [ "$RIGHTS" != true ]; then
              echo "::error::Tick rights_confirmed ONLY if you own this video or have permission to reuse both audio and footage. Otherwise select automatic search."
              exit 1
            fi
          else
            echo "::error::Unknown speech source selected."
            exit 1
          fi
      - name: Install lightweight real-speech tools (no CUDA/TensorFlow)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          echo 'Using lightweight dependencies: no TensorFlow, CUDA or inaSpeechSegmenter.'
      - name: Optional voice separator
        if: ${{ inputs.separate_music }}
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir demucs
          python -m pip cache purge || true
          df -h .
      - name: Generate sample, then ALWAYS upload a private Cloudinary preview
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TOPIC: ${{ inputs.topic }}
          VIDEO_URL: ${{ inputs.speaker_video_url }}
          RIGHTS: ${{ inputs.rights_confirmed }}
          CLEAN: ${{ inputs.clean_confirmed }}
          SEPARATE: ${{ inputs.separate_music }}
        run: |
          ARGS=(test-video --source "$SPEECH_MODE" --query "$TOPIC")
          if [ "$SPEECH_MODE" = clip ]; then ARGS+=(--speaker-video-url "$VIDEO_URL"); fi
          if [ "$RIGHTS" = true ]; then ARGS+=(--rights-confirmed); fi
          if [ "$CLEAN" = true ]; then ARGS+=(--clean-confirmed); fi
          if [ "$SEPARATE" = true ]; then ARGS+=(--separate-music); fi
          ARGS+=(--upload)
          python -m motivation "${ARGS[@]}"
          echo "Uploaded PRIVATE sample to Cloudinary Media Library > motivation-test-previews."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-voice-preview
          path: |
            output/test-video/final.mp4
            output/test-video/result.json
            output/test-video/captions.srt
          if-no-files-found: warn
          retention-days: 2
