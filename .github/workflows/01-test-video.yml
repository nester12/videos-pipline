name: 1 - Test Video (original human voice)
on:
  workflow_dispatch:
    inputs:
      source:
        description: Archive finds licensed speech; Clip preserves a real speaker on camera
        type: choice
        options: [archive, clip]
        default: archive
      topic:
        type: string
        default: motivational speech
      speaker_video_url:
        description: Approved direct Cloudinary MP4 URL in clip mode
        type: string
      rights_confirmed:
        description: I have reuse rights for the supplied speaker video
        type: boolean
        default: false
      clean_confirmed:
        description: I reviewed the recording and it has no background music
        type: boolean
        default: false
      separate_music:
        description: Separate speech from existing music using Demucs
        type: boolean
        default: false
      upload_cloudinary:
        description: Upload only if source rights have been reviewed
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real-speech tools (no synthetic voice)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r requirements.txt inaSpeechSegmenter
      - name: Optional voice separator
        if: ${{ inputs.separate_music }}
        run: python -m pip install --disable-pip-version-check demucs
      - name: Render preview using original voice and recorded CC0 soundtrack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SOURCE: ${{ inputs.source }}
          TOPIC: ${{ inputs.topic }}
          VIDEO_URL: ${{ inputs.speaker_video_url }}
          RIGHTS: ${{ inputs.rights_confirmed }}
          CLEAN: ${{ inputs.clean_confirmed }}
          SEPARATE: ${{ inputs.separate_music }}
          UPLOAD: ${{ inputs.upload_cloudinary }}
        run: |
          ARGS=(test-video --source "$SOURCE" --query "$TOPIC" --speaker-video-url "$VIDEO_URL")
          if [ "$RIGHTS" = true ]; then ARGS+=(--rights-confirmed); fi
          if [ "$CLEAN" = true ]; then ARGS+=(--clean-confirmed); fi
          if [ "$SEPARATE" = true ]; then ARGS+=(--separate-music); fi
          if [ "$UPLOAD" = true ]; then ARGS+=(--upload); fi
          python -m motivation "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-voice-preview
          path: |
            output/test-video/final.mp4
            output/test-video/result.json
            output/test-video/captions.srt
          if-no-files-found: warn
          retention-days: 2
